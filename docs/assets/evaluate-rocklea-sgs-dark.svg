<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Rocklea SGS reproduction against ordinary kriging</title>
  <desc id="d">Downhole semivariance at 1 m: truths 56.2, ordinary kriging 2.2, SGS mean 81.5 (band 75.5 to 88.2). Variance of the truths 310.6, of ordinary kriging 154.9, of the realizations 318.3.</desc>
