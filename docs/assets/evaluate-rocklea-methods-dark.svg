<svg xmlns="http://www.w3.org/2000/svg" width="780" height="452" viewBox="0 0 780 452" role="img" aria-labelledby="t d">
  <title id="t">Rocklea methods and variants against ordinary kriging</title>
  <desc id="d">Paired mean absolute-error differences with 95 % hole-block intervals. NN: +2.73 [+1.17, +4.25], RMSE 18.30; IDW: +0.31 [-0.18, +0.81], RMSE 14.14; SK: +0.08 [+0.01, +0.15], RMSE 13.49; UK: +2.52 [+0.07, +6.00], RMSE 19.23; LMC cokriging: +0.38 [-0.11, +0.94], RMSE 13.94; SGS (E-type): +2.01 [+1.45, +2.68], RMSE 14.73; OK, 8 samples, 3 per hole: +0.34 [-0.19, +0.93], RMSE 14.48; OK, 64 samples, no cap: +0.44 [-0.03, +0.90], RMSE 13.90; OK, best isotropic model: +0.27 [-0.04, +0.55], RMSE 13.94; OK, interval supports: +0.17 [-0.23, +0.56], RMSE 13.95; cokriging, secondaries at target: -8.26 [-9.65, -7.02], RMSE 5.29.</desc>
  <style>
    .t { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
